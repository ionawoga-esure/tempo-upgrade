apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-datasource
  namespace: tempo
  labels:
    grafana_datasource: "1"
data:
  tempo.yaml: |
    apiVersion: 1
    datasources:
      - name: Tempo
        type: tempo
        uid: tempo
        url: http://tempo-query-frontend.monitoring.svc.cluster.local:3200
        access: proxy
        version: 1
        editable: false
        isDefault: true
