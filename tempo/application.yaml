apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/ionawoga-esure/tempo-upgrade.git
    targetRevision: main
    path: tempo      # <-- this is the folder with kustomization.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: tempo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true