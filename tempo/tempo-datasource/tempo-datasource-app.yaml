apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo-datasource
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/ionawoga-esure/tempo-upgrade.git
    targetRevision: main
    path: tempo/tempo-datasource      # folder containing tempo-datasource.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: tempo           # namespace where Grafana is reading datasources

  syncPolicy:
    automated:
      prune: true
      selfHeal: true